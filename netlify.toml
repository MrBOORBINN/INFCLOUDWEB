[build]
  command = "npm run build"
  publish = "dist"

# Netlify: Protect API routes from returning index.html
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

# Netlify: SPA client-side deep routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and popup enablement for Firebase Google Sign-In & High-Speed Network Caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
