<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle for PWA maskable safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- INFCLOUD Geometric Symbol: Cloud with interlocking Infinity fold -->
  <g filter="url(#subtleGlow)" transform="translate(56, 96)">
    <!-- Main Cloud Silhouette -->
    <path
      d="M300 240 H100 C55.8 240 20 204.2 20 160 C20 120.5 48.6 87.7 86.8 81.3 C96.2 35.1 137.1 0 186.7 0 C225.8 0 259.4 21.8 276.4 54.1 C288.7 45.2 303.8 40 320 40 C359.8 40 392.6 69.4 398.8 107.8 C411.5 116.8 420 131.8 420 148.8 C420 178.6 397.6 203.2 368.5 206.8 L300 206.8"
      fill="none"
      stroke="url(#cloudGrad)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Central Infinity / Storage Core node -->
    <path
      d="M140 180 C140 160 160 140 186.7 140 C220 140 240 180 273.3 180 C300 180 320 160 320 140"
      fill="none"
      stroke="url(#accentGrad)"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="186.7" cy="140" r="10" fill="#38bdf8" />
    <circle cx="273.3" cy="180" r="10" fill="#2563eb" />
  </g>
</svg>
